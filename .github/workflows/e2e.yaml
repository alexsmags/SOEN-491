name: E2E

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VITE_API_URL: http://localhost:5000
      PW_TEST_HTML_REPORT: never

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ai-image-captioner/client/package-lock.json
            ai-image-captioner/server/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci
        working-directory: ai-image-captioner/client

      - name: Install server deps
        run: npm ci
        working-directory: ai-image-captioner/server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload test results (videos/screenshots/traces, on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
